<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d9482f">
<title>今天吃什么 · 摇一摇决定</title>
<meta name="description" content="两个板块：调理食谱（补血、暖胃、健脾）和日常餐食。摇一摇老虎机，决定今天吃什么。">
<meta property="og:title" content="今天吃什么 · 摇一摇决定">
<meta property="og:description" content="补血、暖胃、健脾调理食谱，加上饺子、炒粉、番茄炒蛋等日常餐食。摇一摇，别再纠结。">
<meta property="og:type" content="website">
<style>
  :root{
    --bg:#fff7ec;
    --bg2:#ffefd9;
    --ink:#2b2118;
    --muted:#8a7663;
    --brand:#d9482f;
    --brand-deep:#a92f1c;
    --gold:#e8a33d;
    --card:#fffdf9;
    --line:#f0dfcc;
    --green:#4d7a4a;
    --shadow:0 10px 30px rgba(120,70,30,.10);
    --radius:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 500px at 15% -10%, #ffe3c2 0%, transparent 60%),
      radial-gradient(900px 420px at 110% 0%, #ffd9c9 0%, transparent 55%),
      var(--bg);
    min-height:100vh;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .wrap{max-width:760px;margin:0 auto;padding:28px 18px 56px}

  header.hero{text-align:center;padding:14px 6px 22px}
  .hero .kicker{
    display:inline-flex;align-items:center;gap:6px;
    font-size:12px;letter-spacing:.18em;color:var(--brand-deep);
    background:#ffe9d8;border:1px solid #ffd3b8;border-radius:999px;
    padding:6px 12px;margin-bottom:14px;
  }
  .hero h1{
    margin:0;font-size:clamp(30px,8vw,44px);line-height:1.15;
    letter-spacing:-.02em;font-weight:800;
  }
  .hero h1 em{font-style:normal;color:var(--brand)}
  .hero p{margin:12px auto 0;max-width:30em;color:var(--muted);font-size:14px;line-height:1.7}

  .tabs{
    display:grid;grid-template-columns:1fr 1fr;gap:8px;
    background:#fff1df;border:1px solid #f5ddc4;border-radius:16px;
    padding:6px;margin:6px 0 18px;position:sticky;top:10px;z-index:20;
    backdrop-filter:blur(10px);
  }
  .tab{
    appearance:none;border:0;background:transparent;border-radius:12px;
    padding:12px 10px;font-size:15px;font-weight:700;color:#8a6d55;
    cursor:pointer;transition:all .22s ease;font-family:inherit;
    display:flex;align-items:center;justify-content:center;gap:7px;
  }
  .tab .dot{width:7px;height:7px;border-radius:50%;background:#d8bda3;transition:background .2s}
  .tab.active{background:var(--brand);color:#fff;box-shadow:0 6px 16px rgba(217,72,47,.28)}
  .tab.active .dot{background:#ffd9c9}
  .tab:not(.active):hover{background:#ffe8d3}

  .section-note{
    display:block;
    color:var(--muted);font-size:12.5px;line-height:1.6;
    margin:-6px 2px 16px;
  }
  .section-note b{color:var(--brand-deep)}

  /* ---------- 老虎机 ---------- */
  .machine{
    position:relative;border-radius:24px;padding:18px 16px 16px;
    background:
      radial-gradient(120% 90% at 50% -20%, #5a3522 0%, #2b1a11 58%, #1e120c 100%);
    box-shadow:0 22px 50px rgba(80,40,15,.28), inset 0 0 0 1px rgba(255,205,140,.18);
    overflow:hidden;
  }
  .machine::before{
    content:"";position:absolute;inset:8px;border-radius:18px;
    border:1px dashed rgba(255,205,140,.22);pointer-events:none;
  }
  .machine-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:0 6px 12px;position:relative;z-index:1;
  }
  .machine-head .label{
    color:#ffd9a8;font-size:12px;letter-spacing:.16em;font-weight:700;
  }
  .machine-head .badge{
    font-size:11px;color:#ffd9a8;border:1px solid rgba(255,217,168,.35);
    border-radius:999px;padding:4px 9px;background:rgba(255,217,168,.08);
  }
  .reels{
    display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
    position:relative;z-index:1;
  }
  .reel{
    background:linear-gradient(180deg,#fffaf0,#ffe9cc);
    border-radius:14px;min-height:104px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:6px;padding:10px 6px;text-align:center;
    box-shadow:inset 0 1px 0 #fff, 0 6px 14px rgba(0,0,0,.22);
    border:2px solid #f1d3a8;
    overflow:hidden;position:relative;
  }
  .reel::after{
    content:"";position:absolute;left:0;right:0;top:0;height:38%;
    background:linear-gradient(180deg,rgba(255,255,255,.65),transparent);pointer-events:none;
  }
  .reel .emoji{font-size:26px;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.12))}
  .reel .name{
    font-size:12.5px;font-weight:800;line-height:1.3;color:#5a3418;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    word-break:break-all;
  }
  .reel.spinning .emoji{animation:jitter .18s infinite}
  .reel.spinning .name{filter:blur(.6px);opacity:.75}
  @keyframes jitter{
    0%{transform:translateY(-2px) rotate(-3deg)}
    50%{transform:translateY(2px) rotate(3deg)}
    100%{transform:translateY(-2px) rotate(-3deg)}
  }
  .spin-row{display:flex;gap:10px;margin-top:14px;position:relative;z-index:1}
  .spin-btn{
    flex:1;appearance:none;border:0;border-radius:14px;padding:15px 16px;
    font-size:16px;font-weight:800;color:#3a1c0c;cursor:pointer;
    background:linear-gradient(180deg,#ffd27a,#f0a33d);
    box-shadow:0 8px 0 #a8641c, 0 14px 24px rgba(0,0,0,.28);
    transition:transform .08s ease, box-shadow .08s ease;
    font-family:inherit;letter-spacing:.02em;
  }
  .spin-btn:active{transform:translateY(4px);box-shadow:0 4px 0 #a8641c, 0 8px 16px rgba(0,0,0,.24)}
  .spin-btn:disabled{opacity:.7;cursor:wait}
  .spin-btn .sub{display:block;font-size:11px;font-weight:600;opacity:.75;margin-top:3px}

  /* ---------- 结果 ---------- */
  .result{
    margin-top:18px;background:var(--card);border:1px solid var(--line);
    border-radius:22px;box-shadow:var(--shadow);padding:20px 18px;
    display:none;position:relative;overflow:hidden;
  }
  .result.show{display:block;animation:pop .42s cubic-bezier(.2,.9,.3,1.3)}
  @keyframes pop{0%{opacity:0;transform:translateY(14px) scale(.97)}100%{opacity:1;transform:none}}
  .result::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:5px;
    background:linear-gradient(180deg,var(--brand),var(--gold));
  }
  .result .top{display:flex;align-items:center;gap:12px}
  .result .big-emoji{
    width:52px;height:52px;border-radius:16px;background:#fff0df;
    display:flex;align-items:center;justify-content:center;font-size:28px;flex:0 0 auto;
  }
  .result h2{margin:0;font-size:22px;line-height:1.25}
  .result .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .tag{
    font-size:11px;color:var(--brand-deep);background:#ffe9d8;
    border:1px solid #ffd3b8;border-radius:999px;padding:3px 8px;font-weight:700;
  }
  .tag.green{color:#3f6a3c;background:#eaf4e6;border-color:#cfe4c8}
  .result .why{margin:14px 0 0;color:#5c4a3a;font-size:14px;line-height:1.75}
  .block-title{
    font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--muted);
    margin:18px 0 8px;text-transform:uppercase;
  }
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    font-size:13px;background:#fbf1e4;border:1px solid #f0dcc5;
    color:#5f4936;border-radius:10px;padding:7px 10px;
  }
  .steps{margin:0;padding-left:20px;color:#5c4a3a;font-size:14px;line-height:1.9}
  .steps li::marker{color:var(--brand);font-weight:800}
  .note{
    margin-top:14px;font-size:12px;line-height:1.7;color:#8a6a4a;
    background:#fff6e9;border:1px dashed #f0d3b2;border-radius:12px;padding:10px 12px;
  }

  /* ---------- 列表 ---------- */
  .list-head{display:flex;align-items:baseline;justify-content:space-between;margin:28px 2px 12px}
  .list-head h3{margin:0;font-size:17px}
  .list-head span{color:var(--muted);font-size:12px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .dish{
    text-align:left;appearance:none;border:1px solid var(--line);background:var(--card);
    border-radius:16px;padding:13px 12px;cursor:pointer;font-family:inherit;
    box-shadow:0 4px 12px rgba(120,70,30,.05);transition:transform .15s ease, box-shadow .15s ease;
    display:flex;gap:10px;align-items:flex-start;color:var(--ink);
  }
  .dish:hover{transform:translateY(-2px);box-shadow:0 10px 20px rgba(120,70,30,.10)}
  .dish .de{font-size:22px;line-height:1.2;flex:0 0 auto}
  .dish .dn{display:block;font-size:14px;font-weight:800;line-height:1.35}
  .dish .dt{display:block;margin-top:3px;font-size:11px;color:var(--muted);line-height:1.4}
  .dish .mini-tag{
    display:inline-block;margin-top:6px;font-size:10px;color:var(--brand-deep);
    background:#fff0e0;border-radius:6px;padding:2px 6px;
  }

  footer{margin-top:36px;text-align:center;color:#a08b74;font-size:11.5px;line-height:1.8}
  footer .heart{color:var(--brand)}

  @media (max-width:360px){
    .grid{grid-template-columns:1fr}
    .reel{min-height:92px}
    .reel .name{font-size:11.5px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="kicker">DAILY FOOD PICKER</div>
    <h1>今天吃<em>什么</em></h1>
    <p>调理身体有调理的吃法，嘴馋有嘴馋的吃法。<br>选个板块，摇一摇，把选择交给老虎机。</p>
  </header>

  <nav class="tabs" aria-label="板块切换">
    <button class="tab active" id="tabDaily" data-tab="daily" aria-selected="true">
      <span class="dot"></span>日常餐食
    </button>
    <button class="tab" id="tabCare" data-tab="care" aria-selected="false">
      <span class="dot"></span>调理食谱
    </button>
  </nav>

  <p class="section-note" id="sectionNote"></p>

  <section class="machine" aria-label="今天吃什么老虎机">
    <div class="machine-head">

      <div class="reel" id="reel2"><span class="emoji">🥣</span><span class="name">准备中</span></div>
    </div>
    <div class="spin-row">
      <button class="spin-btn" id="spinBtn">
        摇一摇，决定今天吃什么
        <span class="sub">停在哪格就吃哪个</span>

    </div>
  </section>

  <section class="result" id="result" aria-live="polite">
    <div class="top">
      <div class="big-emoji" id="resultEmoji">🍜</div>

    <ol class="steps" id="resultSteps"></ol>
    <div class="note" id="resultNote"></div>
  </section>

  <div class="list-head">
    <h3 id="listTitle">这个板块还有什么</h3>
    <span id="listCount"></span>
  </div>
  <div class="grid" id="grid"></div>

  <footer>
    愿每一顿都吃得舒服。<span class="heart">♥</span><br>
    调理食谱仅作日常饮食参考，不能替代医生诊断；有基础疾病或正在服药请先咨询医生。
  </footer>
</div>

      why: "四季豆煸到起皱，配肉末和干辣椒，越嚼越香。适合想多做一道下饭菜。",
      ingredients: ["四季豆", "肉末", "干辣椒", "花椒", "蒜", "生抽"],
      steps: ["四季豆去筋，掰段，擦干水。", "多一点油，中小火煸到表皮起皱盛出。", "炒香肉末、干辣椒、花椒和蒜。", "倒回四季豆，加生抽和盐翻匀。"],
      note: "四季豆一定要炒熟透，半生的容易引起不适。"
    },
    {
      name: "红烧肉", emoji: "🍖", tags: ["硬菜", "下饭", "费时"],
      why: "五花肉炖到软糯，汤汁拌饭。适合周末有时间、想好好犒劳自己的时候。",
      ingredients: ["五花肉", "冰糖", "生抽", "老抽", "八角", "姜", "料酒"],
      steps: ["五花肉切块，冷水下锅焯水。", "小火炒冰糖到焦糖色，下肉块裹色。", "加姜、八角、料酒、生抽老抽和热水。", "小火炖 1 小时，最后大火收汁。"],
      note: "炒糖色别炒糊，苦了就重新来；一次别吃太多。"
    },
    {
      name: "清蒸鲈鱼", emoji: "🐟", tags: ["清淡", "高蛋白", "宴客"],
      why: "鲈鱼刺少肉嫩，清蒸最能吃出鲜味。适合家里来客、或者想吃清淡高蛋白的一顿。",
      ingredients: ["鲈鱼", "葱姜", "蒸鱼豉油", "料酒", "油"],
      steps: ["鱼处理干净，两面划刀，抹料酒和姜片。", "水开上锅，大火蒸 8～10 分钟。", "倒掉盘中腥水，铺葱丝。", "淋蒸鱼豉油，浇一勺热油。"],
      note: "鱼眼凸出、鱼肉刚离骨就熟了，别蒸老。"
    },
    {
      name: "可乐鸡翅", emoji: "🥤", tags: ["甜口", "快手", "小孩爱吃"],
      why: "鸡翅煎香后用可乐焖，甜咸油亮，几乎不会失败。适合新手和家里有小朋友。",
      ingredients: ["鸡翅中", "可乐", "生抽", "老抽", "姜", "料酒"],
      steps: ["鸡翅两面划刀，焯水或煎到微黄。", "加姜、料酒、生抽、老抽。", "倒可乐没过鸡翅，中小火焖 15 分钟。", "大火收汁到浓稠。"],
      note: "可乐本身很甜，不用再加糖；收汁时勤翻动。"
    }
  ];

  var POOLS = { daily: DAILY, care: CARE };
  var META = {
    daily: {
      note: "<b>日常餐食</b>：饺子、炒粉、番茄炒蛋、火锅……嘴馋和管饱都在这边。摇到哪个就吃哪个，别再刷外卖软件了。",
      badge: "日常池",
      listTitle: "这个板块还有什么"
    },
    care: {
      note: "<b>调理食谱</b>：按补血、暖胃、健脾、易消化来分。适合想吃得舒服一点、最近气色差或胃里发凉的时候。",
      badge: "调理池",
      listTitle: "调理食谱还有这些"
    }
  };

  var state = { tab: "daily", spinning: false, current: null, timers: [], intervals: [] };

  var $ = function (id) { return document.getElementById(id); };
  var reels = [$("reel0"), $("reel1"), $("reel2")];

  function pick(pool) {
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function renderReel(el, dish) {
    el.innerHTML = '<span class="emoji">' + dish.emoji + '</span><span class="name">' + dish.name + '</span>';
  }

  function renderGrid() {
    var pool = POOLS[state.tab];
    var grid = $("grid");
    grid.innerHTML = "";
    pool.forEach(function (dish) {
      var b = document.createElement("button");
      b.className = "dish";
      b.type = "button";
      b.innerHTML =
        '<span class="de">' + dish.emoji + '</span>' +
        '<span><span class="dn">' + dish.name + '</span>' +
        '<span class="dt">' + dish.tags.slice(0, 2).join(" · ") + '</span>' +
        '<span class="mini-tag">' + dish.tags[0] + '</span></span>';
      b.addEventListener("click", function () {
        showResult(dish);
        $("result").scrollIntoView({ behavior: "smooth", block: "center" });
      });
      grid.appendChild(b);
    });
    $("listCount").textContent = pool.length + " 个选项";
  }

  function showResult(dish) {
    state.current = dish;
    $("resultEmoji").textContent = dish.emoji;
    $("resultName").textContent = dish.name;
    $("resultWhy").textContent = dish.why;
    $("resultNote").textContent = dish.note || "";
    $("resultNote").style.display = dish.note ? "block" : "none";

    var tags = $("resultTags");
    tags.innerHTML = "";
    dish.tags.forEach(function (t, i) {
      var s = document.createElement("span");
      s.className = "tag" + (i > 0 ? " green" : "");
      s.textContent = t;
      tags.appendChild(s);
    });

    var ing = $("resultIngredients");
    ing.innerHTML = "";
    dish.ingredients.forEach(function (it) {
      var s = document.createElement("span");
      s.className = "chip";
      s.textContent = it;
      ing.appendChild(s);
    });

    var steps = $("resultSteps");
    steps.innerHTML = "";
    dish.steps.forEach(function (it) {
      var li = document.createElement("li");
      li.textContent = it;
      steps.appendChild(li);
    });

    $("result").classList.add("show");
  }

  function clearTimers() {
    state.timers.forEach(clearTimeout);
    state.timers = [];
    state.intervals.forEach(clearInterval);
    state.intervals = [];
  }

  function settle(dish, delay, idx) {
    state.timers.push(setTimeout(function () {
      reels[idx].classList.remove("spinning");
      renderReel(reels[idx], dish);
      // 第三格落定后再出结果，制造一点悬念
      if (idx === 2) {
        state.spinning = false;
        $("spinBtn").disabled = false;
        showResult(dish);
        $("result").scrollIntoView({ behavior: "smooth", block: "center" });
      }
    }, delay));
  }

  function spin() {
    if (state.spinning) return;
    state.spinning = true;
    clearTimers();
    $("result").classList.remove("show");
    $("spinBtn").disabled = true;

    var pool = POOLS[state.tab];
    var chosen = pick(pool);

    reels.forEach(function (el) { el.classList.add("spinning"); });

    // 三个转轮各自滚动，落定时间错开
    [0, 1, 2].forEach(function (idx) {
      var tick = setInterval(function () {
        renderReel(reels[idx], pick(pool));
      }, 70 + idx * 15);
      state.intervals.push(tick);
      state.timers.push(setTimeout(function () {
        clearInterval(tick);
      }, 1100 + idx * 260));
    });

    // 最终三格统一到同一道菜（老虎机的仪式感，结果明确）
    state.timers.push(setTimeout(function () { renderReel(reels[0], chosen); }, 1100));
    state.timers.push(setTimeout(function () { renderReel(reels[1], chosen); }, 1360));
    state.timers.push(setTimeout(function () { renderReel(reels[2], chosen); }, 1620));

    [0, 1, 2].forEach(function (idx) {
      state.timers.push(setTimeout(function () {
        reels[idx].classList.remove("spinning");
      }, 1100 + idx * 260));
    });

    state.timers.push(setTimeout(function () {
      state.spinning = false;
      $("spinBtn").disabled = false;
      showResult(chosen);
      $("result").scrollIntoView({ behavior: "smooth", block: "center" });
    }, 1850));
  }

  function setTab(tab) {
    if (state.tab === tab && state.current) return;
    state.tab = tab;
    state.current = null;
    clearTimers();
    state.spinning = false;
    $("spinBtn").disabled = false;
    $("result").classList.remove("show");

    document.querySelectorAll(".tab").forEach(function (btn) {
      var on = btn.getAttribute("data-tab") === tab;
      btn.classList.toggle("active", on);
      btn.setAttribute("aria-selected", on ? "true" : "false");
    });

    $("sectionNote").innerHTML = META[tab].note;
    $("machineBadge").textContent = META[tab].badge;
    $("listTitle").textContent = META[tab].listTitle;

    var pool = POOLS[tab];
    reels.forEach(function (el, i) { renderReel(el, pool[i % pool.length]); });
    renderGrid();
  }

  document.querySelectorAll(".tab").forEach(function (btn) {
    btn.addEventListener("click", function () {
      setTab(btn.getAttribute("data-tab"));
    });
  });

  $("spinBtn").addEventListener("click", spin);

  // 首次进入：日常板块，三格先展示不同菜，等待摇
  setTab("daily");
})();
</script>
</body>
</html>
